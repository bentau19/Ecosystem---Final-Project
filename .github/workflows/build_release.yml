name: Build & Release

on:
  push:
    branches:
      - main          # CI builds on every push to main
    tags:
      - 'v*.*.*'      # Release pipeline fires on version tags (v1.0.0, v1.2.3-beta, etc.)
  workflow_dispatch:  # Allow manually triggering a build+release from the GitHub UI

jobs:
  # =========================
  # WINDOWS BUILD
  # =========================
  windows-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: ./.github/actions/tau_sync
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: ./.github/actions/winfsp

      - name: Build native
        run: |
          cmake -S desktop/native/windows/pipe -B desktop/native/windows/pipe/build
          cmake --build desktop/native/windows/pipe/build --config Release

      - name: Copy file
        run: |
          Copy-Item `
            desktop/native/windows/pipe/build/Release/pipe_module.cp313-win_amd64.pyd `
            desktop/native/windows/pipe/

      - name: Build VirtualDrive native
        # Produces desktop/native/windows/virtual_drive/build/Release/VirtualDrive.exe,
        # which main_app.spec bundles into the frozen SyncDose app.
        run: |
          cmake -S desktop/native/windows/virtual_drive -B desktop/native/windows/virtual_drive/build
          cmake --build desktop/native/windows/virtual_drive/build --config Release

      - name: Install deps
        run: |
          pip install -r TauSync/windows/requirements.txt
          pip install -r FileDetection/requirements.txt
          pip install -r desktop/requirements.txt
          pip install TauSync/windows
          pip install pyinstaller

      - name: Build EXEs
        run: |
          pyinstaller desktop/installer/Package/specs/main_app.spec --distpath desktop/installer/Package/dist
          pyinstaller desktop/installer/Package/specs/file_handler.spec --distpath desktop/installer/Package/dist

      - name: Download bundle prerequisites
        # The offline Bundle embeds these two redistributables (see Bundle.wxs).
        # They are NOT committed to the repo, so fetch them here before the build.
        # -RetryIntervalSec/-MaximumRetryCount guard against transient CDN hiccups.
        run: |
          $bundleDir = "desktop/installer/Bundle"
          Invoke-WebRequest `
            -Uri "https://builds.dotnet.microsoft.com/dotnet/Runtime/8.0.16/dotnet-runtime-8.0.16-win-x64.exe" `
            -OutFile "$bundleDir/dotnet-runtime-8.0.16-win-x64.exe" `
            -MaximumRetryCount 3 -RetryIntervalSec 5
          Invoke-WebRequest `
            -Uri "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi" `
            -OutFile "$bundleDir/winfsp-2.0.23075.msi" `
            -MaximumRetryCount 3 -RetryIntervalSec 5
          Invoke-WebRequest `
            -Uri "https://github.com/obsproject/obs-studio/releases/download/32.1.2/OBS-Studio-32.1.2-Windows-x64-Installer.exe" `
            -OutFile "$bundleDir/OBS-Studio-32.1.2-Windows-x64-Installer.exe" `
            -MaximumRetryCount 3 -RetryIntervalSec 5

      - name: Build installer
        # Bundle.wixproj has a ProjectReference to Package.wixproj,
        # so this single command builds Package.msi first, then the Bundle .exe.
        # Bundle.wxs uses local SourceFile payloads => WiX embeds .NET + WinFSP
        # into SyncDoseSetup.exe, producing a fully offline installer.
        run: dotnet build desktop/installer/Bundle/ -c Release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/installer/Bundle/bin/*/Release/SyncDoseSetup.exe

  # =========================
  # ANDROID BUILD
  # =========================
  android-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Decode keystore
        # KEYSTORE_BASE64 secret = base64 of the release .jks. Decoded to a file
        # the signingConfig in app/build.gradle.kts reads via KEYSTORE_PATH below.
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/android/app/release.jks"

      - name: Build RELEASE APK
        env:
          # app/build.gradle.kts release signingConfig reads these four env vars.
          # KEYSTORE_PATH is absolute so Gradle file() resolves it unambiguously.
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: cd android && ./gradlew :app:assembleRelease

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/*.apk


  # =========================
  # RELEASE — only on version tags (v*.*.*)
  # =========================
  deploy:
    needs: [windows-build, android-build]
    runs-on: ubuntu-latest
    # Only create a GitHub Release when a semantic version tag is pushed.
    # Branch pushes (main, feature branches) build artifacts but do NOT publish a release.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # Required by softprops/action-gh-release to create releases

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: artifacts/android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "SyncDose ${{ github.ref_name }}"
          generate_release_notes: true   # auto-generates changelog from commits since last tag
          files: |
            artifacts/windows/**/SyncDoseSetup.exe
            artifacts/android/**/*.apk