name: Build & Release


on:
  push:

jobs:
  # =========================
  # WINDOWS BUILD
  # =========================
  windows-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tau_sync

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build native
        run: |
          cmake -S desktop/native/windows/pipe -B desktop/native/windows/pipe/build
          cmake --build desktop/native/windows/pipe/build --config Release

      - name: Copy file
        run: |
          Copy-Item `
            desktop/native/windows/pipe/build/Release/pipe_module.cp313-win_amd64.pyd `
            desktop/native/windows/pipe/

      - name: Install deps
        run: |
          pip install -r TauSync/windows/requirements.txt
          pip install -r desktop/requirements.txt
          pip install TauSync/windows
          pip install pyinstaller

      - name: Build EXEs
        run: |
          pyinstaller desktop/installer/Package/specs/main_app.spec --distpath desktop/installer/Package/dist
          pyinstaller desktop/installer/Package/specs/file_handler.spec --distpath desktop/installer/Package/dist

      - name: Build installer
        run: dotnet build desktop/installer/Bundle/ -c Release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            desktop/installer/Package/bin/Release/*.msi
            desktop/installer/Bundle/bin/Release/SyncDoseSetup.exe

  # =========================
  # ANDROID BUILD
  # =========================
  android-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Build DEBUG APK
        run: cd android && ./gradlew :app:assembleDebug

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk


  # =========================
  # RELEASE (UPLOAD TO GITHUB RELEASE)
  # =========================
  deploy:
    needs: [ windows-build, android-build ]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: artifacts/android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/windows/**/*.exe
            artifacts/android/**/*.apk