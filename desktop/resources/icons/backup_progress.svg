<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient: deep navy (matches logo) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d2a3a"/>
    </linearGradient>

    <!-- Foreground teal gradient (matches logo accent) -->
    <linearGradient id="fgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5c0"/>
      <stop offset="100%" style="stop-color:#00b4d8"/>
    </linearGradient>

    <!-- Subtle glow for the arrow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="roundedRect">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedRect)">
    <!-- Base background -->
    <rect width="512" height="512" fill="url(#bgGrad)"/>

    <!-- Subtle grid lines (matches logo style) -->
    <g opacity="0.04" stroke="#00e5c0" stroke-width="1">
      <line x1="0" y1="64"  x2="512" y2="64"/>
      <line x1="0" y1="128" x2="512" y2="128"/>
      <line x1="0" y1="192" x2="512" y2="192"/>
      <line x1="0" y1="256" x2="512" y2="256"/>
      <line x1="0" y1="320" x2="512" y2="320"/>
      <line x1="0" y1="384" x2="512" y2="384"/>
      <line x1="0" y1="448" x2="512" y2="448"/>
      <line x1="64"  y1="0" x2="64"  y2="512"/>
      <line x1="128" y1="0" x2="128" y2="512"/>
      <line x1="192" y1="0" x2="192" y2="512"/>
      <line x1="256" y1="0" x2="256" y2="512"/>
      <line x1="320" y1="0" x2="320" y2="512"/>
      <line x1="384" y1="0" x2="384" y2="512"/>
      <line x1="448" y1="0" x2="448" y2="512"/>
    </g>

    <!-- ═══ CLOUD ════════════════════════════════════════════════════════ -->
    <!-- Three overlapping circles form the cloud top, a rect fills the base -->
    <g filter="url(#glow)">
      <circle cx="188" cy="210" r="78"  fill="url(#fgGrad)" opacity="0.95"/>
      <circle cx="286" cy="182" r="96"  fill="url(#fgGrad)" opacity="0.95"/>
      <circle cx="366" cy="216" r="70"  fill="url(#fgGrad)" opacity="0.95"/>
      <!-- Cloud base rectangle connecting the three bumps -->
      <rect   x="136" y="232" width="304" height="68" fill="url(#fgGrad)" opacity="0.95"/>
    </g>

    <!-- ═══ UPWARD ARROW ══════════════════════════════════════════════════ -->
    <!-- The tip of the triangle touches the cloud base, conveying "upload" -->
    <g filter="url(#glow)">
      <!-- Arrowhead triangle: tip at (256, 288), base at y=374 -->
      <polygon points="256,288  186,374  326,374" fill="url(#fgGrad)" opacity="0.95"/>
      <!-- Arrow shaft: from y=370 down to y=450, 44 px wide, centred -->
      <rect x="234" y="368" width="44" height="82" rx="10" fill="url(#fgGrad)" opacity="0.95"/>
    </g>

    <!-- Fine teal border ring (matches logo) -->
    <rect x="2" y="2" width="508" height="508" rx="111" ry="111"
          fill="none" stroke="#00e5c0" stroke-width="1.5" opacity="0.12"/>
  </g>
</svg>
